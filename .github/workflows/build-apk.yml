name: Build Antigravity Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.10.2

    - name: Generate Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.10.2
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Antigravity-Mobile-Debug-APK
        path: app/build/outputs/apk/debug/*.apk

    - name: Create or Update GitHub Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "Antigravity Mobile v1.0.0 (Cloud Sandbox)"
        body: |
          ### Antigravity Mobile for Android
          - Powered by Google GenAI Interactions API (`antigravity-preview-09-2026`)
          - Remote cloud Linux sandbox container with unrestricted network egress
          - Built with Jetpack Compose & Material 3
          - Models: Gemini 3.8 Flash & Gemini 4 Argon
        files: app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
